# Lightweight compilation and unit-test check for openmetadata-integration-tests
# and openmetadata-mcp.
#
# Catches stale Maven artifacts, missing transitive dependencies, and
# incompatible type mismatches early — without needing Docker or a running server.
#
# The key step is `mvn clean install -am` which rebuilds all upstream modules
# (common → spec → sdk → service → mcp) from source before compiling the
# integration-tests module, ensuring the classpath is always consistent.
# After compilation, openmetadata-mcp unit tests are run as a fast smoke check.

name: Integration Tests Compile & MCP Unit Tests

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "openmetadata-service/**"
      - "openmetadata-integration-tests/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-sdk/**"
      - "openmetadata-mcp/**"
      - "openmetadata-clients/**"
      - "common/**"
      - "pom.xml"
      - "bootstrap/**"
  pull_request:
    types: [labeled, opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: compile-and-mcp-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Detect whether relevant paths changed. When no matching files are modified
  # the downstream job is skipped via its `if` condition.
  # A job skipped by `if` reports as "Success", so required checks still pass.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    outputs:
      java: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.java }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: ${{ github.event_name != 'workflow_dispatch' }}

      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            java:
              - '.github/workflows/compile-and-mcp-tests.yml'
              - 'openmetadata-service/**'
              - 'openmetadata-integration-tests/**'
              - 'openmetadata-spec/src/main/resources/json/schema/**'
              - 'openmetadata-sdk/**'
              - 'openmetadata-mcp/**'
              - 'openmetadata-clients/**'
              - 'common/**'
              - 'pom.xml'
              - 'bootstrap/**'

  compile-and-mcp-tests:
    name: Compile & MCP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.java == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev python3-venv librdkafka-dev gcc libsasl2-dev build-essential libssl-dev libffi-dev \
          librdkafka-dev unixodbc-dev libevent-dev jq
          sudo make install_antlr_cli

      # Clean install of all upstream modules from source to prevent stale artifact issues.
      # Without this step, cached ~/.m2 artifacts from a previous commit can cause
      # "cannot access" and "incompatible types" errors when schema classes change.
      - name: Clean install upstream modules and compile integration-tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B clean install -pl :openmetadata-integration-tests -am -DskipTests

      # Run openmetadata-mcp unit tests as a fast smoke check (no Docker needed).
      - name: Run openmetadata-mcp unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B test -pl :openmetadata-mcp -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dmaven.javadoc.skip=true -Denforcer.skip=true

      - name: Upload mcp surefire reports
        if: ${{ failure() && hashFiles('openmetadata-mcp/target/surefire-reports/TEST-*.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-surefire-reports
          path: openmetadata-mcp/target/surefire-reports/

  # Single required-check gate for branch protection.
  # Reports "Success" when the compile job passes or is legitimately skipped.
  # Reports failure only when the compile job fails or is cancelled.
  # Set "Integration Tests Compile & MCP Unit Tests / compile-and-mcp-tests-status"
  # as the sole required check for this workflow.
  compile-and-mcp-tests-status:
    name: compile-and-mcp-tests-status
    needs: [changes, compile-and-mcp-tests]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
